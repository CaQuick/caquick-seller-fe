# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: 'ko-KR'

reviews:
  profile: 'chill'
  request_changes_workflow: false
  commit_status: true
  fail_commit_status: false
  high_level_summary: true
  high_level_summary_in_walkthrough: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false

  path_filters:
    - '!src/graphql/generated/**'
    - '!schema/schema.graphql'
    - '!src/shared/ui/**'
    - '!assets/**'
    - '!pnpm-lock.yaml'

  path_instructions:
    - path: 'src/**/*.{ts,tsx}'
      instructions: |
        Expo SDK 57 + Expo Router + TanStack Query React Native 앱. docs/guide/architecture-conventions.md가 기준입니다.
        - shared는 features를 import하면 안 되고, feature 간 import는 대상 index.ts로만 가능합니다.
        - 색상 hex는 src/shared/config/tokens.ts에만 둡니다. 컴포넌트·tailwind className에 hex를 직접 쓰면 지적하세요.
        - accessToken은 메모리(zustand), refreshToken은 expo-secure-store에만 둡니다. AsyncStorage에 토큰·세션을 저장하면 안 됩니다(AsyncStorage는 상품 임시저장 초안 전용).
        - 401/UNAUTHENTICATED는 refresh를 한 번만 공유해(in-flight 1회) 재시도 1회로 끝나야 합니다. 재귀·반복 refresh, refreshToken을 Authorization 헤더로 보내는 코드는 지적하세요.
        - 날짜·시간은 src/shared/lib/kst.ts(UTC+9 산술)로만 다룹니다. Intl·toLocaleString·dayjs timezone은 Hermes 편차 때문에 쓰지 않습니다.
        - 쿼리 키는 feature의 키 팩토리로만 만들고, mutation 뒤 관련 키를 invalidate해야 합니다. 구독 이벤트는 워터마크(updatedAt·lastMessageAt) 비교로 역순 도착을 버려야 합니다.
        - GraphQL ID는 문자열 그대로 다루며 "0"·빈 문자열을 truthy 검사로 버리면 안 됩니다.
        - RN SafeAreaView 대신 react-native-safe-area-context 훅, 터치 영역 44pt·accessibilityLabel을 확인하세요.
        - 기능 변경에는 테스트(MSW 기반)가 함께 있는지 확인하세요.
    - path: 'app/**/*.tsx'
      instructions: |
        expo-router 라우트 파일은 얇게 유지합니다 — feature index.ts의 화면 컴포넌트를 조립만 하고, 데이터 호출·비즈니스 로직·스타일 상세를 두지 않습니다.
        app/ 안에 spec 파일이 있으면 지적하세요(typed routes가 빈 router.d.ts를 만듭니다). 탭 안에 중첩 Stack을 두지 않습니다(iOS Release 스플래시 행).
    - path: '{app.config.ts,eas.json}'
      instructions: |
        번들 ID·패키지(com.caquick.seller)·scheme(caquickseller)·slug는 스토어 등록 뒤 바꿀 수 없습니다. 변경이 있으면 지적하세요.
        비밀값(키·토큰)이 설정에 들어가면 안 됩니다. EAS projectId·updates.url은 TODO로 남아 있는 상태가 정상입니다.
    - path: '.github/workflows/**/*.yml'
      instructions: |
        GitHub Actions는 최소 권한, 시크릿 노출 방지, fork 안전성, SHA 핀을 중심으로 리뷰하세요.
        release.yml은 운영 호스트(맥미니)의 셀프호스트 러너에서 돕니다 — fork PR이 닿지 않는지, 시크릿 파일(.secrets·credentials.json)을 always()로 지우는지, 호스트 락을 푸는지 확인하세요.
    - path: 'infra/**'
      instructions: |
        러너·서명 자산·시크릿 절차는 public 레포에 비밀값이 남지 않는지, 롤백 절차가 있는지 중심으로 리뷰하세요.
    - path: 'terraform/**'
      instructions: |
        Ruleset 필수 체크 이름이 워크플로 잡 이름과 일치하는지, prevent_destroy·bypass 범위가 바뀌지 않았는지 확인하세요.
    - path: 'scripts/**'
      instructions: |
        CI·호스트에서 실행되는 스크립트입니다. 외부 의존 없이 동작하는지, 실패 시 종료 코드가 분명한지, 반증 테스트가 있는지 확인하세요.
    - path: 'src/**/*.spec.{ts,tsx}'
      instructions: |
        네트워크는 MSW(msw/node)로 mock했는지, RNTL 14 async API(await render/fireEvent)를 쓰는지, 정상 흐름뿐 아니라 에러·경계 케이스가 있는지 확인하세요.

  pre_merge_checks:
    title:
      mode: warning
      requirements: 'PR 제목은 Conventional Commits 형식으로 변경 내용을 간결하게 설명해야 합니다.'
    description:
      mode: off

knowledge_base:
  code_guidelines:
    enabled: true
  learnings:
    scope: local
  issues:
    scope: local
  pull_requests:
    scope: local
  web_search:
    enabled: true

chat:
  auto_reply: false
