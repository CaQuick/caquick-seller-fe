name: CI

# 관리자 FE pr-check.yml 구조 그대로. 네이티브 빌드는 여기 없다(main 머지 뒤 release.yml, 맥미니).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  # PR push는 같은 PR의 이전 실행을 취소, main/develop push는 커밋별 독립 실행(기준 커버리지 아티팩트 유실 방지)
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # test 잡 matrix.shard와 함께 바꾼다 — coverage-report가 샤드 개수를 이 값과 대조한다
  SHARD_COUNT: 3

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (24.x) & pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # 관리자 FE의 `pnpm build` 자리에 expo-doctor + expo export(Metro 번들이 두 플랫폼에서 성공하는지)
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (24.x) & pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Codegen freshness
        run: pnpm codegen:check

      - name: Dead code / unused deps (knip)
        run: pnpm knip:check

      # jest roots가 src뿐이라 CI 스크립트 테스트는 node:test로 따로 돈다
      - name: CI scripts (node:test)
        run: node --test '.github/scripts/__tests__/*.spec.mjs'

      - name: Expo doctor
        run: pnpm doctor

      - name: Bundle smoke (expo export)
        run: pnpm export

  # 샤드는 커버리지 일부만 가져 임계를 끈다('--coverageThreshold={}'). 임계는 coverage-report가 합친 맵으로 검사한다
  test:
    name: test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (24.x) & pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test shard with coverage
        env:
          SHARD: ${{ matrix.shard }}
        # --outputFile은 폴더를 만들지 않는다
        run: |
          mkdir -p coverage
          pnpm exec jest --ci --coverage --shard="$SHARD/$SHARD_COUNT" \
            --json --outputFile=coverage/report.json --testLocationInResults \
            '--coverageThreshold={}' --coverageReporters=text-summary

      # 실패한 샤드도 올린다 — 재실행 때 같은 이름이 생기므로 덮어쓴다
      - name: Upload shard result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/report.json
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  # 필수 체크라 always()로 돈다 — needs 실패로 건너뛰면(skipped) 통과로 잡힌다
  coverage-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # base 브랜치 push 실행의 기준 아티팩트 조회
      pull-requests: write
      checks: write # 실패 테스트 annotation
    steps:
      - name: Require all test shards passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$TEST_RESULT" != "success" ]; then
            echo "test 샤드 결과: $TEST_RESULT"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js (24.x) & pnpm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 샤드별 하위 폴더(coverage/shards/coverage-shard-N/report.json) — merge-coverage가 폴더 단위로 읽는다
      - name: Download shard results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage/shards

      # 샤드 누락·테스트 실패·임계(jest.config.js) 미달이면 실패. report.json·lcov.info·coverage-final.json을 남긴다
      - name: Merge shard reports (coverage thresholds)
        env:
          SHARD_TOTAL: ${{ env.SHARD_COUNT }}
        run: pnpm coverage:merge coverage/shards coverage

      # develop·main push의 합친 report.json이 이후 PR의 비교 기준이 된다. 업로드 실패가 릴리즈를 막지 않게 둔다
      - name: Upload base coverage (push)
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-json
          path: coverage/report.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error

      # 기준은 이 레포 base 브랜치의 성공한 push 실행만(PR 실행 아티팩트는 믿지 않음). base 커밋 실행 우선, 그다음 최신 5개.
      # 없으면 head를 기준 자리에 둔다(차이 0) — 기준 경로가 바뀌면 댓글 액션이 댓글을 새로 달기 때문에 경로는 늘 같다
      - name: Fetch base coverage (PR)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage/report.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          runs() {
            gh api "repos/$REPO/actions/workflows/pr-check.yml/runs?event=push&status=success&branch=$BASE_REF$1" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == env.REPO) | .id' || true
          }
          mkdir -p coverage/base
          for run in $( { runs "&head_sha=$BASE_SHA&per_page=1"; runs "&per_page=5"; } | awk '!seen[$0]++'); do
            if gh run download "$run" -R "$REPO" -n coverage-report-json -D coverage/base; then
              echo "기준: $BASE_REF push 실행 $run"
              exit 0
            fi
          done
          echo "::notice::$BASE_REF의 기준 커버리지 아티팩트가 없어 head를 기준으로 둔다(차이 0)"
          cp coverage/report.json coverage/base/report.json

      - name: Coverage report (PR comment)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('coverage/report.json') != '' }}
        uses: ArtiomTr/jest-coverage-report-action@7f750dd50f5585533321eb7ebc482b936b49a5d4 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-file: coverage/report.json
          base-coverage-file: coverage/base/report.json
          annotations: failed-tests

      # CODECOV_TOKEN이 레포 시크릿에 있을 때만 — 등록 전에는 건너뛰고, 등록 뒤 실패는 CI 실패로 드러낸다.
      # 댓글 액션 뒤에 둔다 — codecov-action이 업로드 토큰을 GITHUB_ENV로 내보내 뒤 단계 env에 남긴다
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          disable_search: true
          name: seller-fe-lcov
          fail_ci_if_error: true

  # 필수 체크 집계. 건너뜀·취소도 실패로 본다 — 보호된 status라 --no-verify·훅 미설치를 우회하지 못한다
  check:
    if: always()
    needs: [lint, static, test, coverage-report]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        with:
          subjectPattern: ^.+$
          subjectPatternError: |
            PR 제목이 Conventional Commits 형식이 아닙니다.
            예: "feat: 새 기능 추가", "fix: 버그 수정"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
