name: Release

# main 머지 → CI 성공 → 맥미니(macmini-seller)에서 fingerprint 비교 → 네이티브가 바뀐 플랫폼만 로컬 빌드(+submit) → OTA 발행.
# 로컬 빌드는 EAS 빌드 기록에 남지 않으므로 "이 fingerprint로 빌드가 나갔는가"는 git 태그가 원장이다(태그 삭제 금지):
#   shipped/<platform>/<hash>  스토어 제출까지 성공    built/<platform>/<hash>  아티팩트만(스토어 계정 전)
# fingerprint 계산·eas update --channel production은 이 호스트에서만 한다 — 호스트가 다르면 해시가 달라 기존 바이너리가 업데이트를 못 받는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: '대상 플랫폼'
        type: choice
        options: [all, ios, android]
        default: all
      force_build:
        description: 'fingerprint가 같아도 빌드'
        type: boolean
        default: false
      submit:
        description: 'auto = 시크릿 있으면 제출, skip = 제출 안 함'
        type: choice
        options: [auto, skip]
        default: auto
      republish_group:
        description: '롤백: 이 update group ID를 재발행하고 종료(빌드·OTA 없음)'
        required: false
        default: ''

permissions:
  contents: write # 원장 태그
  actions: read

concurrency:
  group: seller-release
  cancel-in-progress: false

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
  # 운영 호스트 보호 — 빌드가 운영 컨테이너를 밀어내지 않게. 데몬을 끄면 빌드 뒤 메모리가 돌아온다
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.jvmargs=-Xmx3g
  CI: 'true'

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, macmini-seller]
    environment: production
    timeout-minutes: 120
    env:
      PLATFORM: ${{ inputs.platform || 'all' }}
      FORCE_BUILD: ${{ inputs.force_build || 'false' }}
      REPUBLISH_GROUP: ${{ inputs.republish_group || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0 # 원장 태그 조회
          persist-credentials: false

      # 관리자 FE deploy.yml과 동일: main 끝이 아닌 커밋의 늦은 CI는 건너뛴다
      - name: Skip if not the current main head
        if: github.event_name == 'workflow_run'
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          if [ "$RUN_SHA" != "$MAIN_SHA" ]; then
            echo "main 끝($MAIN_SHA)이 아닌 커밋($RUN_SHA) — 건너뜀"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      # BE jest와 같은 포트(127.0.0.1:47391)를 쥔다 — 둘 중 하나만 호스트를 쓴다. 잡이 어떻게 끝나든 OS가 포트를 푼다
      - name: Host lock (BE jest와 직렬화)
        if: env.SKIP != '1'
        run: |
          pid=$(node scripts/host-lock.mjs acquire --timeout-sec 1800)
          echo "HOST_LOCK_PID=$pid" >> "$GITHUB_ENV"

      - name: Install
        if: env.SKIP != '1'
        run: pnpm install --frozen-lockfile

      # 플랫폼에 필요한 도구만 본다 — Xcode 설치 전에도 Android 빌드는 돌아야 한다
      - name: Toolchain check
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          node -v; pnpm -v
          eas whoami
          if [ "$PLATFORM" != android ]; then
            xcodebuild -version | head -1
            pod --version
            fastlane --version | tail -1
          fi
          if [ "$PLATFORM" != ios ]; then
            java -version 2>&1 | head -1
            # cmdline-tools 23부터 목록이 `ndk/…`처럼 `/`로 나온다 — 두 구분자를 다 받고, 패키지마다 따로 확인한다
            installed=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed)
            for pkg in 'ndk[;/]' 'build-tools[;/]36' 'platforms[;/]android-36'; do
              grep -Eq "$pkg" <<< "$installed" || { echo "::error::Android SDK 패키지 없음: $pkg"; exit 1; }
            done
          fi

      - name: Republish (rollback) and exit
        if: env.SKIP != '1' && env.REPUBLISH_GROUP != ''
        run: |
          set -euo pipefail
          eas update:republish --group "$REPUBLISH_GROUP" --non-interactive --json \
            --message "republish $REPUBLISH_GROUP"
          echo "SKIP=1" >> "$GITHUB_ENV"

      # Environment 시크릿은 잡 if:에서 직접 못 읽는다 — 단계에서 outputs로 바꾼다
      - name: Resolve submit capability
        if: env.SKIP != '1'
        id: cap
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_APP: ${{ vars.ASC_APP_ID }}
          PLAY_SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          IOS_STORE_READY: ${{ vars.IOS_STORE_READY }}
          INPUT_SUBMIT: ${{ inputs.submit || 'auto' }}
        run: |
          ios=false; android=false
          [ -n "$ASC_KEY" ] && [ -n "$ASC_APP" ] && ios=true
          [ -n "$PLAY_SA" ] && android=true
          [ "$INPUT_SUBMIT" = skip ] && ios=false && android=false
          # iOS 스토어 빌드는 Apple 원격 credentials가 있을 때만(IOS_STORE_READY=true) — 없으면 시뮬레이터 프로필
          ios_profile=$([ "$IOS_STORE_READY" = true ] && echo production || echo production-simulator)
          echo "ios=$ios android=$android ios_profile=$ios_profile"
          {
            echo "submit_ios=$ios"
            echo "submit_android=$android"
            echo "ios_profile=$ios_profile"
          } >> "$GITHUB_OUTPUT"

      # 플랫폼별 fingerprint → 원장 태그(shipped|built/<platform>/<hash>)가 있으면 OTA만, 없으면 빌드
      - name: Fingerprint & plan
        if: env.SKIP != '1'
        id: plan
        env:
          SUBMIT_IOS: ${{ steps.cap.outputs.submit_ios }}
          SUBMIT_ANDROID: ${{ steps.cap.outputs.submit_android }}
        run: |
          set -euo pipefail
          for p in ios android; do
            if [ "$PLATFORM" != all ] && [ "$PLATFORM" != "$p" ]; then
              { echo "${p}_build=false"; echo "${p}_update=false"; } >> "$GITHUB_OUTPUT"
              continue
            fi
            hash=$(eas fingerprint:generate --platform "$p" --environment production --non-interactive --json | jq -r .hash)
            [ -n "$hash" ] && [ "$hash" != null ] || { echo "$p fingerprint 계산 실패"; exit 1; }
            if [ "$p" = ios ]; then submit=$SUBMIT_IOS; else submit=$SUBMIT_ANDROID; fi
            ledger=$([ "$submit" = true ] && echo shipped || echo built)
            if [ "$FORCE_BUILD" = true ] || [ -z "$(git tag -l "$ledger/$p/$hash")" ]; then build=true; else build=false; fi
            echo "$p: fingerprint=$hash ledger=$ledger build=$build"
            { echo "${p}_hash=$hash"; echo "${p}_build=$build"; echo "${p}_update=true"; echo "${p}_ledger=$ledger"; } >> "$GITHUB_OUTPUT"
          done

      - name: Restore Android keystore (credentials.json)
        if: env.SKIP != '1' && steps.plan.outputs.android_build == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          [ -n "$KS_B64" ] && [ -n "$KS_PW" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PW" ] || { echo "ANDROID_KEYSTORE_* 시크릿 없음 — infra/README.md"; exit 1; }
          mkdir -p .secrets
          printf '%s' "$KS_B64" | base64 -d > .secrets/release.keystore
          jq -n --arg p .secrets/release.keystore --arg sp "$KS_PW" --arg a "$KEY_ALIAS" --arg kp "$KEY_PW" \
            '{android:{keystore:{keystorePath:$p,keystorePassword:$sp,keyAlias:$a,keyPassword:$kp}}}' > credentials.json

      # nice는 자식(xcodebuild·gradle)에 전파된다. 시뮬레이터 프로필은 서명 없이 .app(tar.gz)
      - name: Build iOS (local)
        if: env.SKIP != '1' && steps.plan.outputs.ios_build == 'true'
        id: build_ios
        env:
          PROFILE: ${{ steps.cap.outputs.ios_profile }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ext=$([ "$PROFILE" = production ] && echo ipa || echo tar.gz)
          nice -n 15 eas build -p ios -e "$PROFILE" --local --non-interactive --output "artifacts/seller-ios.$ext"
          echo "artifact=artifacts/seller-ios.$ext" >> "$GITHUB_OUTPUT"

      - name: Build Android (local)
        if: env.SKIP != '1' && steps.plan.outputs.android_build == 'true'
        id: build_android
        env:
          SUBMIT_ANDROID: ${{ steps.cap.outputs.submit_android }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          nice -n 15 eas build -p android -e production --local --non-interactive --output artifacts/seller-android.aab
          # 스토어 제출 전에는 설치용 APK도 남긴다(같은 keystore)
          if [ "$SUBMIT_ANDROID" != true ]; then
            nice -n 15 eas build -p android -e production-apk --local --non-interactive --output artifacts/seller-android.apk
          fi

      - name: Submit iOS (TestFlight)
        if: env.SKIP != '1' && steps.build_ios.outcome == 'success' && steps.cap.outputs.submit_ios == 'true'
        env:
          ASC_KEY_B64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ARTIFACT: ${{ steps.build_ios.outputs.artifact }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .secrets
          printf '%s' "$ASC_KEY_B64" | base64 -d > .secrets/AuthKey.p8
          eas submit -p ios -e production --path "$ARTIFACT" --non-interactive --wait

      - name: Submit Android (Play internal)
        if: env.SKIP != '1' && steps.build_android.outcome == 'success' && steps.cap.outputs.submit_android == 'true'
        env:
          PLAY_SA_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .secrets
          printf '%s' "$PLAY_SA_B64" | base64 -d > .secrets/play-service-account.json
          eas submit -p android -e production --path artifacts/seller-android.aab --non-interactive --wait

      # 빌드(+제출)가 끝난 fingerprint만 기록한다 — 앞 단계가 실패하면 여기 도달하지 못한다.
      # checkout이 자격을 남기지 않으므로 태그는 API로 만든다(같은 해시를 force_build로 다시 빌드하면 커밋만 옮긴다)
      - name: Record ledger tags
        if: env.SKIP != '1' && (steps.plan.outputs.ios_build == 'true' || steps.plan.outputs.android_build == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          IOS_BUILD: ${{ steps.plan.outputs.ios_build }}
          IOS_TAG: ${{ steps.plan.outputs.ios_ledger }}/ios/${{ steps.plan.outputs.ios_hash }}
          ANDROID_BUILD: ${{ steps.plan.outputs.android_build }}
          ANDROID_TAG: ${{ steps.plan.outputs.android_ledger }}/android/${{ steps.plan.outputs.android_hash }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag() {
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$1" -f sha="$sha" > /dev/null 2>&1 \
              || gh api -X PATCH "repos/$REPO/git/refs/tags/$1" -f sha="$sha" -F force=true > /dev/null
            echo "원장 태그 $1 → $sha"
          }
          [ "$IOS_BUILD" = true ] && tag "$IOS_TAG"
          [ "$ANDROID_BUILD" = true ] && tag "$ANDROID_TAG"
          true

      # OTA: fingerprint가 안 바뀐 플랫폼은 항상, 바뀐 플랫폼은 빌드 성공 뒤에만(깨진 네이티브 커밋이 고아 업데이트를 남기지 않게).
      # 발행 결과의 runtimeVersion이 계산한 fingerprint와 다르면 실패 — 계산 환경 불일치 조기 감지
      - name: EAS Update (iOS)
        if: >-
          env.SKIP != '1' && steps.plan.outputs.ios_update == 'true' &&
          (steps.plan.outputs.ios_build == 'false' || steps.build_ios.outcome == 'success')
        env:
          HASH: ${{ steps.plan.outputs.ios_hash }}
          MESSAGE: ${{ github.sha }}
        run: |
          set -euo pipefail
          out=$(eas update --channel production --environment production --platform ios \
            --message "$MESSAGE" --non-interactive --json)
          echo "$out" | jq .
          rv=$(echo "$out" | jq -r '.[0].runtimeVersion')
          [ "$rv" = "$HASH" ] || { echo "runtimeVersion($rv) ≠ fingerprint($HASH) — 계산 환경 불일치"; exit 1; }

      - name: EAS Update (Android)
        if: >-
          env.SKIP != '1' && steps.plan.outputs.android_update == 'true' &&
          (steps.plan.outputs.android_build == 'false' || steps.build_android.outcome == 'success')
        env:
          HASH: ${{ steps.plan.outputs.android_hash }}
          MESSAGE: ${{ github.sha }}
        run: |
          set -euo pipefail
          out=$(eas update --channel production --environment production --platform android \
            --message "$MESSAGE" --non-interactive --json)
          echo "$out" | jq .
          rv=$(echo "$out" | jq -r '.[0].runtimeVersion')
          [ "$rv" = "$HASH" ] || { echo "runtimeVersion($rv) ≠ fingerprint($HASH) — 계산 환경 불일치"; exit 1; }

      - name: Upload artifacts
        if: ${{ !cancelled() && env.SKIP != '1' && hashFiles('artifacts/*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seller-${{ github.sha }}
          path: artifacts/
          retention-days: 14
          overwrite: true

      - name: Cleanup secrets
        if: always()
        run: rm -rf .secrets credentials.json

      - name: Release host lock
        if: always()
        run: '[ -n "${HOST_LOCK_PID:-}" ] && kill "$HOST_LOCK_PID" 2>/dev/null || true'

      - name: Discord
        if: always() && env.SKIP != '1'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IOS_BUILD: ${{ steps.plan.outputs.ios_build }}
          IOS_UPDATE: ${{ steps.plan.outputs.ios_update }}
          IOS_HASH: ${{ steps.plan.outputs.ios_hash }}
          ANDROID_BUILD: ${{ steps.plan.outputs.android_build }}
          ANDROID_UPDATE: ${{ steps.plan.outputs.android_update }}
          ANDROID_HASH: ${{ steps.plan.outputs.android_hash }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "DISCORD_WEBHOOK_URL 없음 — 알림 생략"; exit 0; }
          if [ "$STATUS" = success ]; then color=3066993; title="릴리즈 성공"; else color=15158332; title="릴리즈 실패"; fi
          desc=$(printf 'caquick-seller-fe %s\nios: build=%s update=%s %s\nandroid: build=%s update=%s %s\n%s' \
            "$SHA" "${IOS_BUILD:--}" "${IOS_UPDATE:--}" "$IOS_HASH" "${ANDROID_BUILD:--}" "${ANDROID_UPDATE:--}" "$ANDROID_HASH" "$RUN_URL")
          payload=$(jq -n --arg t "$title" --arg d "$desc" --argjson c "$color" '{embeds:[{title:$t,description:$d,color:$c}]}')
          curl -fsS -H 'content-type: application/json' -d "$payload" "$DISCORD_WEBHOOK_URL" > /dev/null || echo "Discord 전송 실패"
