# ---- src/features/order/order.types.graphql ----
"""
주문 상태. 구매자·판매자 API가 공용으로 쓴다.

전이는 `SUBMITTED → CONFIRMED → MADE → PICKED_UP` 한 방향이며 각 단계는 직전
상태에서만 진입할 수 있다. `CANCELED`는 `PICKED_UP` 이전 세 상태에서만 가능하고,
어떤 상태에서도 `SUBMITTED`로 되돌아갈 수 없다.
"""
enum OrderStatusType {
  """구매자가 주문을 넣은 직후의 초기 상태. 판매자 확인 대기."""
  SUBMITTED
  """판매자가 주문을 확인·수락한 상태. 제작 대기."""
  CONFIRMED
  """판매자가 제작을 완료해 픽업을 기다리는 상태. "주문 생성됨"이 아니다."""
  MADE
  """구매자가 수령을 마친 종료 상태. 이후 상태 변경 불가."""
  PICKED_UP
  """취소된 종료 상태. 취소 처리에는 사유(note)가 필수다."""
  CANCELED
}

"""주문 상태 변경 이력 1건. 구매자·판매자·관리자 주문 상세가 공용으로 쓴다."""
type OrderStatusHistory {
  id: ID!
  """변경 전 상태. 최초 생성 이력이면 null."""
  fromStatus: OrderStatusType
  """변경 후 상태."""
  toStatus: OrderStatusType!
  """변경 시각."""
  changedAt: DateTime!
  """변경 사유 메모. 취소(CANCELED) 전이에는 필수로 기록된다(관리자 취소는 '[관리자]' 접두)."""
  note: String
}

"""
주문 품목 1건. 구매자·판매자·관리자 주문 상세가 공용으로 쓴다.
가격·옵션·커스텀은 전부 주문 시점 스냅샷이라 이후 상품·옵션이 바뀌거나 삭제돼도 변하지 않는다.
"""
type OrderItemDetail {
  id: ID!
  storeId: ID!
  productId: ID!
  """상품명(주문 시점 스냅샷)."""
  productName: String!
  """정가(원, 주문 시점 스냅샷)."""
  regularPrice: Int!
  """할인가(원, 주문 시점 스냅샷). 할인이 없었으면 null이고 정가가 적용된다."""
  salePrice: Int
  """주문 수량."""
  quantity: Int!
  """이 품목의 합계 금액(원). 옵션 추가금과 수량이 반영된 값이다."""
  itemSubtotalPrice: Int!
  """선택한 옵션(주문 시점 스냅샷)."""
  optionItems: [OrderItemOption!]!
  """입력한 커스텀 문구(주문 시점 스냅샷)."""
  customTexts: [OrderItemCustomText!]!
  """자유 편집 요청(주문 시점 스냅샷)."""
  freeEdits: [OrderItemFreeEdit!]!
}

"""주문 시점의 옵션 스냅샷. 판매자가 이후 옵션을 수정·삭제해도 주문 내용은 변하지 않는다."""
type OrderItemOption {
  id: ID!
  """옵션 그룹명(주문 시점)."""
  groupName: String!
  """선택한 옵션명(주문 시점)."""
  optionTitle: String!
  """옵션 추가금(원, 주문 시점). 음수면 할인으로 동작했다."""
  priceDelta: Int!
}

"""주문 시점의 커스텀 문구 스냅샷."""
type OrderItemCustomText {
  id: ID!
  """문구 슬롯 식별 키(주문 시점)."""
  tokenKey: String!
  """슬롯의 기본 문구(주문 시점)."""
  defaultText: String!
  """구매자가 실제로 입력한 문구."""
  valueText: String!
  """입력 화면 노출 순서. 오름차순."""
  sortOrder: Int!
}

"""주문 시점의 자유 편집 요청 스냅샷. 구매자가 이미지 위에 영역을 지정해 남긴 요청이다."""
type OrderItemFreeEdit {
  id: ID!
  """지정한 편집 영역을 잘라낸 이미지 URL."""
  cropImageUrl: String!
  """해당 영역에 대한 요청 문구."""
  descriptionText: String!
  """요청 순서. 오름차순."""
  sortOrder: Int!
  """참고로 첨부한 이미지. 없으면 빈 배열."""
  attachments: [OrderItemFreeEditAttachment!]!
}

"""자유 편집 요청에 구매자가 첨부한 참고 이미지."""
type OrderItemFreeEditAttachment {
  id: ID!
  """첨부 이미지 URL."""
  imageUrl: String!
  """첨부 순서. 오름차순."""
  sortOrder: Int!
}

