  """
  sortOrder: Int!
  """
  노출 여부. false면 기간과 무관하게 노출하지 않는다.
  """
  isActive: Boolean!
  """
  노출 시작 시각(포함). null이면 시작 제한 없음.
  """
  startsAt: DateTime
  """
  노출 종료 시각(제외). null이면 종료 제한 없음.
  """
  endsAt: DateTime
  createdAt: DateTime!
  updatedAt: DateTime!
}

