  """필수 선택 여부. true면 선택 개수가 minSelect~maxSelect 범위 안이어야 하고, false면 0개 선택도 허용된다."""
  isRequired: Boolean!
  """최소 선택 개수."""
  minSelect: Int!
  """최대 선택 개수. minSelect와 함께 허용 개수를 정한다(둘 다 1이면 단일 선택)."""
  maxSelect: Int!
  """섹션 노출 순서. 오름차순."""
  sortOrder: Int!
  """이 그룹의 선택지. 활성 항목만 온다."""
  items: [ProductDetailOptionItem!]!
}

"""상품 상세 옵션 항목."""
type ProductDetailOptionItem {
