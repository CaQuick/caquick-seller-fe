  """작성자 닉네임. 탈퇴 작성자는 null(FE 익명 표기)."""
  authorNickname: String
  """리뷰 본문. 없으면 null."""
  reviewText: String
  """좋아요 수. 이 값 기준 내림차순으로 정렬된다."""
  likeCount: Int!
  """사용자가 요청한 디자인 이미지(주문 커스텀 자유편집 크롭)."""
  beforeImageUrl: String!
  """실제 완성된 케이크 이미지(리뷰 첫 이미지)."""
