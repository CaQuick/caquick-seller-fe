  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""특정 날짜의 생산 가능 수량. 미설정 날짜는 수량 제한이 없다."""
type SellerStoreDailyCapacity {
  id: ID!
  """대상 날짜. 날짜 부분만 의미가 있다."""
  capacityDate: DateTime!
  """그날 받을 수 있는 최대 주문 수량. 예약분이 이 수를 채우면 달력에서 닫힌다."""
  capacity: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""일별 생산 가능 수량 목록 페이지."""
type SellerStoreDailyCapacityConnection {
  """일별 생산 수량 설정. 최신 등록이 먼저 온다."""
  items: [SellerStoreDailyCapacity!]!
  """조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다."""
  totalCount: Int!
  """다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다."""
  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""
매장 기본 정보 수정 입력. 모든 필드가 선택이며, 전달한 필드만 변경된다
(부분 수정). 전달하지 않은 필드는 기존 값을 유지한다.
"""
input SellerUpdateStoreBasicInfoInput {
  """매장명."""
  storeName: String
  """매장 대표 연락처."""
  storePhone: String
  """전체 주소 문자열."""
  addressFull: String
  """시·도 단위."""
  addressCity: String
  """시·군·구 단위."""
  addressDistrict: String
  """읍·면·동 단위."""
  addressNeighborhood: String
  """위도. 정밀도 손실을 피하려고 문자열로 받는다."""
  latitude: String
  """경도. 정밀도 손실을 피하려고 문자열로 받는다."""
  longitude: String
  """지도 진입에 쓸 provider."""
  mapProvider: StoreMapProvider
  """매장 홈페이지·SNS URL."""
  websiteUrl: String
  """영업시간 안내 문구(자유 입력)."""
  businessHoursText: String
  """매장 프로필(로고) 이미지 URL. null 전달 시 제거. sellerCreateUploadUrl(STORE_IMAGE)로 이 계정에 발급된 publicUrl만 허용, 아니면 BAD_USER_INPUT."""
  profileImageUrl: String
  """문의 채팅 인사말 템플릿. 빈 문자열이면 기본 문구로 되돌린다(null 저장)."""
  greetingMessage: String
}

"""
요일별 영업시간 등록·수정 입력. dayOfWeek 기준으로 upsert되므로 같은 요일을 다시
보내면 덮어쓴다.
"""
input SellerUpsertStoreBusinessHourInput {
  """요일. 0=일요일 ~ 6=토요일."""
  dayOfWeek: Int!
  """정기 휴무 여부. true면 openTime·closeTime을 보내지 않아도 된다."""
  isClosed: Boolean!
  """영업 시작 시각. 시:분:초만 저장된다."""
  openTime: DateTime
  """영업 종료 시각. 시:분:초만 저장된다."""
  closeTime: DateTime
}

"""특별휴무 등록·수정 입력."""
input SellerUpsertStoreSpecialClosureInput {
  """수정할 특별휴무 ID. 생략하면 새로 등록한다."""
  closureId: ID
  """휴무 날짜. 날짜 부분만 저장된다."""
  closureDate: DateTime!
  """휴무 사유."""
  reason: String
}

"""
픽업 정책 수정 입력. 세 값이 함께 픽업 달력·시간 슬롯 생성 규칙을 이룬다.
범위를 벗어나면 BAD_USER_INPUT.
"""
input SellerUpdatePickupPolicyInput {
  """픽업 예약 시간 슬롯 간격(분)."""
  pickupSlotIntervalMinutes: Int!
  """최소 리드타임(분). 지금부터 이 시간 이후의 슬롯만 열린다."""
  minLeadTimeMinutes: Int!
  """예약 가능 범위(일). 오늘부터 이 일수까지 달력이 열린다."""
  maxDaysAhead: Int!
}

"""일별 생산 가능 수량 등록·수정 입력."""
input SellerUpsertStoreDailyCapacityInput {
  """수정할 수량 설정 ID. 생략하면 새로 등록한다."""
  capacityId: ID
  """대상 날짜. 날짜 부분만 저장된다."""
  capacityDate: DateTime!
  """그날 받을 수 있는 최대 주문 수량."""
  capacity: Int!
}

"""매장 FAQ 항목. 문의 채팅에서 자동응답 카드로 노출된다."""
type SellerFaqTopic {
  id: ID!
  storeId: ID!
  """FAQ 질문 제목. 채팅에서 버튼 라벨로 쓰인다."""
  title: String!
  """FAQ 답변 본문(HTML). 서버 측 sanitize는 아직 적용돼 있지 않다."""
  answerHtml: String!
  """노출 순서. 오름차순이고 같으면 id 오름차순."""
  sortOrder: Int!
  """노출 여부. false면 구매자에게 보이지 않는다."""
  isActive: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""FAQ 항목 생성 입력."""
input SellerCreateFaqTopicInput {
  """FAQ 질문 제목."""
  title: String!
  """FAQ 답변 본문(HTML)."""
  answerHtml: String!
  """노출 순서. 오름차순이고 같으면 id 오름차순. 미지정 시 0이라 기존이 모두 0이면 맨 뒤에 온다."""
  sortOrder: Int
  """노출 여부. 기본 true."""
  isActive: Boolean = true
}

"""FAQ 항목 수정 입력. 전달한 필드만 변경된다(부분 수정)."""
input SellerUpdateFaqTopicInput {
  topicId: ID!
  """FAQ 질문 제목."""
  title: String
  """FAQ 답변 본문(HTML)."""
  answerHtml: String
  """노출 순서."""
  sortOrder: Int
  """노출 여부."""
  isActive: Boolean
}

# ---- src/features/store/store-today-pickup.graphql ----
extend type Query {
  """오늘 픽업 가능 매장 리스트(인기순). 오늘 예약 가능 슬롯이 있는 매장만. 비로그인 접근 가능."""
  todayPickupStores(input: TodayPickupStoresInput): TodayPickupStoreConnection!
}

"""오늘 픽업 가능 매장 조회 조건. 커서가 아니라 오프셋 방식이다."""
input TodayPickupStoresInput {
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""오늘 픽업 가능 매장 목록."""
type TodayPickupStoreConnection {
  """매장 카드. 오늘 픽업 가능한 매장만 담긴다."""
  items: [TodayPickupStore!]!
  """오늘 픽업 가능한 매장 총수."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
  """슬롯 산출 기준 시각(서버 조회 시점). 화면의 'N시 기준' 표기에 사용."""
  asOf: DateTime!
}

"""오늘 픽업 가능 매장 항목. 공용 매장 카드 + 오늘 슬롯 그리드."""
type TodayPickupStore {
  """매장 카드."""
  store: StoreCard!
  """오늘 영업시간 내 슬롯 목록. 리드타임 마감 슬롯은 available=false."""
  slots: [TodayPickupSlot!]!
}

"""픽업 슬롯("HH:MM")."""
type TodayPickupSlot {
  """슬롯 시각. "HH:MM" (KST)."""
  time: String!
  """지금 예약 가능한지. 리드타임이 지난 슬롯은 false."""
  available: Boolean!
}

# ---- src/features/store/store-wishlist.graphql ----
extend type Query {
  """내가 찜한 매장 목록 (찜 최신순). 비활성/삭제 매장은 제외. 로그인 필요."""
  myWishlistedStores(input: MyWishlistedStoresInput): MyWishlistedStoresConnection!
}

extend type Mutation {
  """매장 찜 추가 (멱등: 이미 있어도 true, soft-delete된 항목은 복원). 로그인 필요."""
  addStoreToWishlist(storeId: ID!): Boolean!
  """매장 찜 해제 (멱등: 이미 없어도 true). 로그인 필요."""
  removeStoreFromWishlist(storeId: ID!): Boolean!
}

"""찜한 매장 목록 조회 조건. 커서가 아니라 오프셋 방식이다."""
input MyWishlistedStoresInput {
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""찜한 매장 목록. 최근 찜한 순으로 온다."""
type MyWishlistedStoresConnection {
  """찜한 매장 카드. 최근 찜한 순으로 온다."""
  items: [WishlistedStore!]!
  """전체 찜 매장 수. offset·limit과 무관하다."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
}

"""찜한 매장 항목. 공용 매장 카드 + 찜 시각. 카드 이미지는 최대 3장, isWishlisted는 항상 true다."""
type WishlistedStore {
  """매장 카드."""
  store: StoreCard!
  """찜한 시각."""
  addedAt: DateTime!
}

# ---- src/features/store/store.types.graphql ----
extend type Query {
  """인기 매장 리스트 (지역 필터 + 인기순). 비로그인 접근 가능."""
  popularStores(input: PopularStoresInput): PopularStoreConnection!
}

"""인기 매장 조회 조건. 커서가 아니라 오프셋 방식이다."""
input PopularStoresInput {
  """2차 시군구 ID 다중 선택. 비우면 전국 대상."""
  regionIds: [ID!]
  """건너뛸 개수. 기본 0."""
  offset: Int = 0
  """한 번에 가져올 개수. 기본 20, 1~50만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""인기 매장 목록. rank 오름차순이다."""
type PopularStoreConnection {
  """인기 매장 항목. rank 오름차순."""
  items: [PopularStore!]!
  """조건에 맞는 전체 매장 수. offset·limit과 무관하다."""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
  """랭킹 산출 기준 시각(서버 조회 시점). 화면의 'N시 기준' 표기에 사용."""
  rankedAt: DateTime!
}

"""인기 매장 항목. rank + 공용 매장 카드."""
type PopularStore {
  """인기 순위. 1부터 시작하며 rankedAt 시점 기준이다."""
  rank: Int!
  """매장 카드."""
  store: StoreCard!
}

"""매장 카드. 인기 매장·오늘 픽업·검색 결과·찜 목록이 공용으로 쓴다."""
type StoreCard {
  id: ID!
  """매장명."""
  storeName: String!
  """매장 프로필(로고) 이미지. 미등록 시 null."""
  profileImageUrl: String
  """평균 평점(0.0~5.0, 소수 첫째 자리). 리뷰 없으면 0.0."""
  ratingAverage: Float!
  """리뷰 수."""
  reviewCount: Int!
  """매장 위치 표기(예: 인천 청라동)."""
  regionLabel: String
  """대표 케이크 이미지(활성 상품 대표 이미지, 최신 상품 우선). 최대 4장, 찜 목록은 3장."""
  cakeImageUrls: [String!]!
  """로그인 사용자의 찜 여부(비로그인 시 false)."""
  isWishlisted: Boolean!
}

"""매장 지도 연동 provider. 구매자·판매자 API가 공용으로 쓴다."""
enum StoreMapProvider {
  """네이버 지도 딥링크를 쓴다."""
  NAVER
  """카카오맵 딥링크를 쓴다."""
  KAKAO
  """지도 연결 없음. 지도 진입 동선을 노출하지 않는다."""
  NONE
}

# ---- src/features/system/system.graphql ----
extend type Query {
  """서버 상태 확인용 핑"""
  ping: String!
}
