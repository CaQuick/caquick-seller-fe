# ---- src/features/product/product-detail.graphql ----
extend type Query {
  """상품 상세. 없거나 비활성/삭제 상품(또는 매장)이면 NOT_FOUND. 비로그인 접근 가능."""
  productDetail(productId: ID!): ProductDetail!
}

"""상품 상세(구매자용)."""
type ProductDetail {
  id: ID!
  """소속 매장 ID(주문/매장 이동용)."""
  storeId: ID!
  """상품명."""
  name: String!
  """상품 설명. 미등록 시 null."""
  description: String
  """구매 전 필독사항."""
