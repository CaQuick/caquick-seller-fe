  nextCursor: String
}

"""
상품 목록 조회 조건. 필터는 AND로 결합되고 미지정 필터는 적용되지 않는다.
"""
input SellerProductListInput {
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
