# ---- src/features/review/review-engagement.graphql ----
extend type Mutation {
  """
  리뷰 좋아요. 로그인 필수.
  """
  likeReview(reviewId: ID!): Boolean!
  """
  리뷰 좋아요 해제(멱등: 좋아요가 없어도 true). 로그인 필수.
  """
  unlikeReview(reviewId: ID!): Boolean!
  """
  리뷰 댓글 작성. 로그인 필수.
  """
  writeReviewComment(input: WriteReviewCommentInput!): MyReviewComment!
  """
  내 리뷰 댓글 삭제(soft). 로그인 필수. 본인 댓글만 가능.
  """
  deleteMyReviewComment(commentId: ID!): Boolean!
}

"""
리뷰 댓글 작성 입력.
"""
input WriteReviewCommentInput {
  reviewId: ID!
  """
  1~500자
  """
  content: String!
}

"""
작성된 내 리뷰 댓글(작성 직후 반환).
"""
type MyReviewComment {
  id: ID!
  reviewId: ID!
  """
  댓글 본문.
  """
  content: String!
  """
  작성 시각.
  """
  createdAt: DateTime!
}

extend type Mutation {
  """
  리뷰를 신고한다. 로그인 필수(USER). 리뷰가 없거나 삭제됐거나 매장·상품이 내려가 있으면 NOT_FOUND,
  본인 리뷰면 BAD_USER_INPUT. 같은 리뷰에 아직 처리되지 않은 내 신고가 있으면 새로 만들지 않고 그 건을 돌려준다(alreadyReported=true).
  """
  reportReview(input: ReportReviewInput!): ReviewReportResult!
  """
  리뷰 댓글을 신고한다. 로그인 필수(USER). 댓글이 없거나 삭제됐거나 리뷰·매장·상품이 내려가 있으면 NOT_FOUND,
  본인 댓글이면 BAD_USER_INPUT. 같은 댓글에 아직 처리되지 않은 내 신고가 있으면 그 건을 돌려준다(alreadyReported=true).
  """
  reportReviewComment(input: ReportReviewCommentInput!): ReviewReportResult!
}

"""
신고 사유.
"""
enum ReviewReportReason {
  """
  광고·도배.
  """
  SPAM
  """
  욕설·비방.
  """
  ABUSE
  """
  부적절한 내용(음란·혐오 등).
  """
  INAPPROPRIATE
  """
  기타. detail에 사유를 적는다.
  """
  OTHER
}

"""
신고 처리 상태.
"""
enum ReviewReportStatus {
  """
  접수됨. 운영자 확인 대기.
  """
  PENDING
  """
  처리됨(대상 삭제).
  """
  RESOLVED
  """
  기각됨(대상 유지).
  """
  REJECTED
}

"""
리뷰 신고 입력.
"""
input ReportReviewInput {
  reviewId: ID!
  """
  신고 사유.
  """
  reason: ReviewReportReason!
  """
  상세 설명. 최대 500자. 선택.
  """
  detail: String
}

"""
리뷰 댓글 신고 입력.
"""
input ReportReviewCommentInput {
  commentId: ID!
  """
  신고 사유.
  """
  reason: ReviewReportReason!
  """
  상세 설명. 최대 500자. 선택.
  """
  detail: String
}

"""
신고 접수 결과.
"""
type ReviewReportResult {
  """
  신고 ID.
  """
  reportId: ID!
  """
  처리 상태. 접수 직후는 PENDING.
  """
  status: ReviewReportStatus!
  """
  이미 접수된 내 신고를 돌려준 경우 true.
  """
  alreadyReported: Boolean!
  """
  접수 시각.
  """
  createdAt: DateTime!
}

# ---- src/features/review/review-listing.graphql ----
extend type Query {
  """
  상품 공개 리뷰 목록(커서). 사진 필터·정렬 지원. 비로그인 접근 가능.
  """
  productReviews(input: ProductReviewsInput!): ProductReviewConnection!

  """
  매장 공개 리뷰 목록(최신순, 커서 기반). 비로그인 접근 가능.
  """
  storeReviews(input: StoreReviewsInput!): StoreReviewConnection!
}

"""
상품 리뷰 목록 조회 조건.
"""
input ProductReviewsInput {
  productId: ID!
  """
  true면 사진(미디어) 있는 리뷰만(사진후기 그리드/사진후기 상세).
  """
  photoOnly: Boolean = false
  """
  정렬 기준. 기본 최신순. 정렬을 바꾸면 기존 cursor는 무효다.
  """
  sort: ReviewSort = LATEST
  """
  이전 페이지의 nextCursor 값(불투명 토큰). 동일 sort에서만 유효.
  """
  cursor: String
  """
  한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT.
  """
  limit: Int = 20
}

"""
매장 리뷰 목록 조회 조건.
"""
input StoreReviewsInput {
  storeId: ID!
  """
  true면 사진(미디어) 있는 리뷰만(사진후기 그리드).
  """
