# ---- src/features/auth/auth.types.graphql ----
"""
계정 종류. JWT 발급 시 결정되며 접근 가능한 API 영역을 가른다.
"""
enum AccountType {
  """
  구매자. 주문·찜·리뷰 등 구매자 API를 쓴다.
  """
  USER
  """
  판매자. 매장 1곳을 보유하며 seller* API를 쓴다.
  """
  SELLER
  """
  운영자. admin* API를 쓴다.
  """
  ADMIN
}

"""
계정 상태. ACTIVE가 아니면 로그인·API 접근이 거부된다.
"""
enum AccountStatus {
  """
  가입 대기. 현재 생성 경로가 없는 예약값이다.
  """
  PENDING
  """
  정상.
  """
  ACTIVE
  """
  운영자가 정지한 상태. 모든 API 접근이 FORBIDDEN이고 refresh 세션도 폐기된다.
  """
  SUSPENDED
}

# ---- src/features/conversation/conversation-center.graphql ----
extend type Query {
  """알림센터 대화 탭 목록(구매자). 마지막 메시지 최신순. 로그인 필수. 본인 데이터만 대상이 된다."""
  myConversations(input: CursorInput): MyConversationConnection!
  """
  채팅 상세 메시지 목록(최신순 키셋 커서). 구매자 본인 대화만 조회 가능하며,
  조회 시 last_read_at을 이번에 반환한 최신 메시지의 작성 시각까지 끌어올린다
  (안읽음 배지 해소 부수효과). 반환할 메시지가 없으면 갱신하지 않는다.
  로그인 필수.
  """
  conversationMessages(conversationId: ID!, input: CursorInput): ConversationMessageConnection!
}


"""대화 목록 응답"""
type MyConversationConnection {
  """대화방 카드. 마지막 메시지가 최근인 순으로 온다."""
  items: [MyConversationItem!]!
  """전체 대화 수"""
  totalCount: Int!
  """다음 페이지 존재 여부."""
  hasMore: Boolean!
  """다음 페이지 커서. 없으면 null"""
  nextCursor: String
}

"""대화 목록 아이템"""
type MyConversationItem {
  """대화 ID"""
  id: ID!
  storeId: ID!
  """매장명."""
  storeName: String!
  """매장 프로필(로고) 이미지 URL. 미등록 시 null"""
  storeProfileImageUrl: String
  """마지막 메시지 미리보기(HTML 메시지는 태그 제거 plain text)"""
  lastMessagePreview: String
  """마지막 메시지 시각. 목록 정렬 기준이다."""
  lastMessageAt: DateTime!
  """읽지 않은 수신 메시지 수(매장명 옆 "(3)" 표기용)"""
  unreadCount: Int!
}


"""채팅 상세 메시지 응답(최신순)"""
type ConversationMessageConnection {
  """메시지. 최신순으로 오므로 화면에서는 역순으로 쌓는다."""
  items: [ConversationMessage!]!
  """대화 전체 메시지 수"""
  totalCount: Int!
  """더 과거 메시지가 남아 있는지."""
  hasMore: Boolean!
  """다음(더 과거) 페이지 커서. 없으면 null"""
  nextCursor: String
}

# ---- src/features/conversation/conversation-inquiry.graphql ----
extend type Query {
  """
  문의 채팅 진입 컨텍스트(구매자). 매장 프로필·상담시간·치환 완료 인사말·질문 칩을
  한 번에 내려준다. 아직 대화가 없어도 조회 가능하며 그 경우 conversationId는 null.
  로그인 필수.
  """
  storeInquiryContext(storeId: ID!): StoreInquiryContext!
}

extend type Mutation {
  """
  구매자 텍스트 메시지 전송. 해당 매장과의 대화가 없으면 이 시점에 생성하고,
  치환 완료된 인사말을 매장 메시지로 먼저 저장한 뒤 유저 메시지를 저장한다.
  로그인 필수.
  """
  sendConversationMessage(input: SendConversationMessageInput!): ConversationMessagesPayload!
  """
  질문 칩(FAQ) 전송. 유저 메시지(칩 제목)와 매장 자동응답(FAQ 답변 HTML)을
  한 트랜잭션으로 저장한다. 첫 전송이면 대화 생성 + 인사말 저장도 함께 수행.
  로그인 필수.
  """
  sendConversationFaqMessage(input: SendConversationFaqMessageInput!): ConversationMessagesPayload!
}

"""문의 채팅 진입 컨텍스트"""
type StoreInquiryContext {
  storeId: ID!
  """매장명."""
  storeName: String!
  """매장 프로필(로고) 이미지 URL. 미등록 시 null"""
  profileImageUrl: String
  """요일별 상담시간(영업시간과 동일 정책). FE가 "월/화/수… 10:00~18:00" 형식으로 조합"""
  businessHours: [InquiryBusinessHour!]!
  """닉네임·매장명 치환이 끝난 인사말"""
  greetingMessage: String!
  """질문 칩 목록(활성 FAQ, 노출 순서대로)"""
  faqTopics: [InquiryFaqTopic!]!
  """기존 대화가 있으면 그 ID, 없으면 null"""
  conversationId: ID
}

"""요일별 상담시간"""
type InquiryBusinessHour {
  """0=일 ~ 6=토"""
  dayOfWeek: Int!
  """해당 요일 휴무 여부. true면 openTime·closeTime이 null이다."""
  isClosed: Boolean!
  """오픈 시각 "HH:mm". 휴무면 null"""
  openTime: String
  """마감 시각 "HH:mm". 휴무면 null"""
  closeTime: String
}

"""질문 칩(매장 FAQ)"""
type InquiryFaqTopic {
  id: ID!
  """칩에 노출되는 질문 제목. 전송하면 이 문구가 유저 메시지로 저장된다."""
  title: String!
}

"""대화 메시지"""
type ConversationMessage {
  id: ID!
  conversationId: ID!
  """발신 주체. 말풍선 좌우 배치 기준이다."""
  senderType: ConversationSenderType!
  """본문 형식. 읽어야 할 본문 필드를 가리킨다."""
  bodyFormat: ConversationBodyFormat!
  """평문 본문. bodyFormat이 TEXT면 이 값을 쓴다."""
  bodyText: String
  """서식 본문. bodyFormat이 HTML이면 이 값을 쓴다."""
  bodyHtml: String
  """발송 시각. 메시지 스트림 정렬은 id 기준이다."""
  createdAt: DateTime!
}

"""메시지 전송 결과. 이번 호출로 저장된 메시지들을 생성 순으로 담는다(첫 전송이면 인사말 포함)"""
type ConversationMessagesPayload {
  """대화방 ID. 첫 전송이면 이번에 생성된 대화방 ID다."""
  conversationId: ID!
  """이번 호출로 저장된 메시지. 생성 순이며 첫 전송이면 인사말이 맨 앞에 온다."""
  messages: [ConversationMessage!]!
}

"""구매자 텍스트 메시지 전송 입력"""
input SendConversationMessageInput {
  """문의할 매장 ID. 대화방이 없으면 이 호출에서 생성된다."""
  storeId: ID!
  """보낼 평문 메시지."""
  bodyText: String!
}

"""질문 칩(FAQ) 전송 입력"""
input SendConversationFaqMessageInput {
  """문의할 매장 ID. 대화방이 없으면 이 호출에서 생성된다."""
  storeId: ID!
  """선택한 질문 칩 ID. storeInquiryContext.faqTopics가 준 값을 쓴다."""
  faqTopicId: ID!
}

# ---- src/features/conversation/conversation-seller.graphql ----
extend type Query {
  """
  내 매장 대화방 목록을 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerConversations(input: CursorInput): SellerConversationConnection!
  """
  대화방 메시지 목록을 조회한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerConversationMessages(
    conversationId: ID!
    input: CursorInput
  ): SellerConversationMessageConnection!
}

extend type Mutation {
  """
  판매자 메시지를 발송한다. 판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않으면 NOT_FOUND.
  """
  sellerSendConversationMessage(
    input: SellerSendConversationMessageInput!
  ): SellerConversationMessage!
  """
  대화방을 판매자가 읽었다고 표시한다. 호출 시점에 존재하는 가장 최근 메시지의 작성 시각까지 sellerLastReadAt을
  전진시키며 과거로 되돌리지 않는다(반복·동시 호출 안전). 메시지가 없으면 변경 없이 현재 상태를 돌려준다.
  조회만으로는 읽음 처리되지 않으므로 앱이 상세 진입 시 호출한다. 판매자 답장은 서버가 마커를 함께 전진시킨다.
  판매자 로그인 필수. SELLER 계정이 아니면 FORBIDDEN, 매장을 보유하지 않거나 내 매장의 대화가 아니면 NOT_FOUND.
  """
  sellerMarkConversationRead(conversationId: ID!): SellerConversation!
}

"""
구매자 1명과의 대화방. 매장당 구매자별로 하나씩 생긴다.
"""
type SellerConversation {
  id: ID!
  """
  대화 상대인 구매자 계정 ID.
  """
  accountId: ID!
  storeId: ID!
  """
  대화 상대인 구매자의 표시명. 대화 생성 시점 스냅샷이라 이후 닉네임 변경·탈퇴가 반영되지 않는다.
  스냅샷 도입 이전 대화 중 복원하지 못한 건은 null.
  """
  buyerNickname: String
  """
  마지막 메시지 미리보기(HTML은 태그 제거). 메시지가 없으면 null.
  """
  lastMessagePreview: String
  """
  마지막 메시지 시각. 메시지가 없으면 null. 목록 정렬 기준은 이 값이 아니라 updated_at이다.
  """
  lastMessageAt: DateTime
  """
  구매자가 이 대화방을 마지막으로 읽은 시각(구매자 조회 시 전진). 읽은 적이 없으면 null.
  """
  lastReadAt: DateTime
  """
  판매자가 마지막으로 읽은 시각. sellerMarkConversationRead 호출과 판매자 답장이 전진시킨다. 읽은 적이 없으면 null.
  """
  sellerLastReadAt: DateTime
  """
  판매자 기준 읽지 않은 구매자 메시지 수(senderType USER이고 sellerLastReadAt 이후 작성). 0이면 답변 필요 대상이 아니다.
  """
  unreadCount: Int!
  updatedAt: DateTime!
}

"""
대화방 목록 페이지. 최근에 갱신된(updated_at 기준) 대화방이 먼저 온다.
"""
type SellerConversationConnection {
  """
  대화방. 최근에 갱신된 순으로 온다.
  """
  items: [SellerConversation!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서(불투명 토큰). null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
대화 메시지 1건. bodyFormat이 읽어야 할 본문 필드를 가리킨다.
발송 시 다른 형식의 본문을 함께 넘기면 그대로 저장되므로, 두 필드가 모두 채워져
있을 수 있다 — 표시할 본문은 bodyFormat으로 고른다.
"""
type SellerConversationMessage {
  id: ID!
  conversationId: ID!
  """
  발신 주체. 말풍선 좌우 배치 기준이다.
  """
  senderType: ConversationSenderType!
  """
  보낸 계정 ID. 사람이 보낸 메시지에만 채워진다.
  시스템 메시지는 물론, 인사말·FAQ 자동응답처럼 서버가 만든 STORE 메시지도 null이다.
  """
  senderAccountId: ID
  """
  본문 형식. 읽어야 할 본문 필드를 가리킨다(다른 쪽에도 값이 남아 있을 수 있다).
  """
  bodyFormat: ConversationBodyFormat!
  """
  평문 본문. bodyFormat이 TEXT면 이 값을 쓴다.
  """
  bodyText: String
  """
  서식 본문. bodyFormat이 HTML이면 이 값을 쓴다.
  """
  bodyHtml: String
  """
  발송 시각.
  """
  createdAt: DateTime!
}

"""
대화 메시지 목록 페이지. 최신 메시지가 먼저 온다.
"""
type SellerConversationMessageConnection {
  """
  메시지. 최신 메시지가 먼저 온다.
  """
  items: [SellerConversationMessage!]!
  """
  조건에 맞는 전체 건수(현재 페이지와 무관). 커서 필터는 제외하고 센다.
  """
  totalCount: Int!
  """
  다음 페이지 존재 여부. limit+1 조회로 판정하므로 추가 쿼리가 없다.
  """
  hasMore: Boolean!
  """
  다음 페이지 커서. null이면 마지막 페이지다.
  """
  nextCursor: String
}

"""
판매자 메시지 발송 입력. bodyFormat에 맞는 본문 필드가 비어 있으면 BAD_USER_INPUT.
내 매장의 대화방이 아니면 NOT_FOUND.
"""
input SellerSendConversationMessageInput {
  conversationId: ID!
  """
  본문 형식. 이 값에 해당하는 본문 필드가 필수다(다른 쪽을 함께 넘기면 그대로 저장된다).
  """
  bodyFormat: ConversationBodyFormat!
  """
  평문 본문(최대 2000자). bodyFormat이 TEXT면 필수.
  """
  bodyText: String
  """
  서식 본문(최대 100000자). bodyFormat이 HTML이면 필수.
  """
  bodyHtml: String
}

# ---- src/features/conversation/conversation-subscription.graphql ----
extend type Subscription {
  """
  대화방 신규 메시지 실시간 구독. 구매자(대화 소유자)와 판매자(해당 매장
  소유자)만 구독할 수 있다. 인증은 graphql-ws connectionParams.authorization.
  """
  conversationMessageAdded(conversationId: ID!): ConversationMessage!
  """구매자 대화 목록/배지 갱신 이벤트(새 메시지 도착 시). 로그인 필수. 본인 데이터만 대상이 된다."""
  myConversationUpdated: ConversationListUpdate!
  """
판매자 대화 목록 갱신 이벤트(고객 메시지 도착 시).
삭제되지 않은 매장을 보유한 판매자만 구독할 수 있다. 매장이 없거나 삭제됐으면 NOT_FOUND.
비활성(is_active=false) 매장은 구독이 유지된다 — 노출만 꺼진 사이에도 고객 문의는 받아야 한다.
"""
  sellerConversationUpdated: SellerConversationListUpdate!
}

"""
구매자 대화 목록 갱신 이벤트.
이벤트 간 도착 순서는 보장되지 않는다 — 구독자는 (lastMessageAt, lastReadAt)을
사전식으로 비교해 이미 표시 중인 상태보다 오래된 이벤트를 폐기해야 한다.
읽음 처리는 lastReadAt만 전진시키므로, 읽음 이후 도착한 지연 이벤트도 이 비교로
걸러진다(메시지 스트림은 id 기준).
"""
type ConversationListUpdate {
  conversationId: ID!
  storeId: ID!
  """매장명."""
  storeName: String!
  """마지막 메시지 미리보기(HTML은 태그 제거)"""
  lastMessagePreview: String
  """마지막 메시지 시각. 폐기 규칙의 1차 비교 키다."""
  lastMessageAt: DateTime!
  """이벤트 스냅샷 시점의 구매자 마지막 읽음 시각(폐기 규칙 비교용)"""
  lastReadAt: DateTime
  """이벤트 시점의 안읽은 수신 메시지 수"""
  unreadCount: Int!
}

"""
판매자 대화 목록 갱신 이벤트(구매자 메시지 도착·판매자 답장). 도착 순서 비보장 — (lastMessageAt, sellerLastReadAt)
사전식 비교로 폐기한다. 읽음 mutation은 이벤트를 내지 않으므로 로컬 읽음 처리 뒤 도착한 이벤트의 unreadCount는
로컬 sellerLastReadAt이 더 크면 0으로 본다.
"""
type SellerConversationListUpdate {
  conversationId: ID!
  """대화 상대인 구매자 계정 ID."""
  accountId: ID!
  """대화 상대 구매자 표시명(대화 생성 시점 스냅샷). 복원 불가 건은 null."""
  buyerNickname: String
  """마지막 메시지 미리보기(HTML은 태그 제거)"""
  lastMessagePreview: String
  """마지막 메시지 시각. 폐기 규칙의 1차 비교 키다."""
  lastMessageAt: DateTime!
  """이벤트 스냅샷 시점의 판매자 마지막 읽음 시각(폐기 규칙 비교용)."""
  sellerLastReadAt: DateTime
  """이벤트 시점의 판매자 기준 미읽음 구매자 메시지 수."""
  unreadCount: Int!
}

# ---- src/features/conversation/conversation.types.graphql ----
"""대화 메시지 발신자 유형. 구매자·판매자 API가 공용으로 쓴다."""
enum ConversationSenderType {
  """구매자가 보낸 메시지."""
  USER
  """판매자(매장)가 보낸 메시지. FAQ 질문 칩에 대한 자동응답도 이 값으로 저장된다."""
  STORE
  """시스템이 발신한 메시지."""
  SYSTEM
}

