# ---- src/features/review/review-admin.graphql ----
extend type Query {
  """
  리뷰·댓글 신고 목록을 최신 접수순으로 조회한다. 기본은 PENDING만. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminReviewReports(
    input: AdminReviewReportListInput
  ): AdminReviewReportConnection!
  """
  신고 1건을 대상 원문과 함께 조회한다. 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminReviewReport(reportId: ID!): AdminReviewReportDetail!
  """
  리뷰 목록을 최신순으로 조회한다(삭제 포함 가능). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminReviews(input: AdminReviewListInput): AdminReviewConnection!
  """
  리뷰 댓글 목록을 최신순으로 조회한다(삭제 포함 가능). 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminReviewComments(
    input: AdminReviewCommentListInput
  ): AdminReviewCommentConnection!
}

extend type Mutation {
  """
  신고를 처리한다. DELETE_TARGET은 대상(리뷰 또는 댓글)을 삭제하고 같은 대상의 다른 미처리 신고도 함께 RESOLVED로 닫는다.
  REJECT는 이 신고만 REJECTED로 닫는다. 이미 처리된 신고면 BAD_USER_INPUT, 없으면 NOT_FOUND.
  관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminResolveReviewReport(
    input: AdminResolveReviewReportInput!
  ): AdminReviewReport!
  """
  리뷰를 강제 삭제(soft-delete)한다. 사진·댓글도 함께 내려가고 미처리 신고는 RESOLVED로 닫힌다.
  없거나 이미 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteReview(input: AdminDeleteReviewInput!): Boolean!
  """
  리뷰 댓글을 강제 삭제(soft-delete)한다. 미처리 신고는 RESOLVED로 닫힌다.
  없거나 이미 삭제됐으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteReviewComment(input: AdminDeleteReviewCommentInput!): Boolean!
}

"""
신고 대상 종류.
"""
enum AdminReviewReportTargetType {
  """
  리뷰.
  """
  REVIEW
  """
  리뷰 댓글.
  """
  REVIEW_COMMENT
}

"""
신고 처리 방식.
"""
enum AdminReviewReportAction {
  """
  대상을 삭제하고 같은 대상의 미처리 신고를 모두 RESOLVED로 닫는다.
  """
  DELETE_TARGET
  """
  이 신고만 REJECTED로 닫고 대상은 유지한다.
  """
  REJECT
}

"""
리뷰·댓글 신고 1건.
"""
type AdminReviewReport {
  id: ID!
  """
  대상 종류.
  """
  targetType: AdminReviewReportTargetType!
  """
  대상 ID(리뷰 또는 댓글).
  """
  targetId: ID!
  """
  신고자 계정 ID.
  """
  reporterAccountId: ID!
  """
  신고 시점의 신고자 닉네임. 이후 닉네임을 바꾸거나 탈퇴해도 그대로 남는다. 이 값을 기록하기 전에 탈퇴한 신고자는 null.
  """
  reporterNickname: String
  """
  신고자가 지금 탈퇴한 상태면 true.
  """
  reporterWithdrawn: Boolean!
  """
  신고 사유.
  """
  reason: ReviewReportReason!
  """
  상세 설명. 없으면 null.
  """
  detail: String
  """
  신고 시점의 대상 본문(리뷰는 2000자까지). 작성자가 삭제·재작성해도 무엇이 신고됐는지 남는다.
  """
  contentSnapshot: String
  """
  처리 상태.
  """
  status: ReviewReportStatus!
  """
  처리한 관리자 계정 ID. 미처리면 null.
  """
  resolvedByAccountId: ID
  """
  처리한 관리자의 처리 시점 라벨 `이름(아이디)`(한쪽만 있으면 그 값). 미처리이거나 작성자 삭제로 닫혔으면 null.
  """
  resolvedByLabel: String
  """
  처리 시각. 미처리면 null.
  """
  resolvedAt: DateTime
  """
  처리 메모. 없으면 null.
  """
  resolutionNote: String
  """
  접수 시각.
  """
  createdAt: DateTime!
}

"""
신고 대상 원문 요약.
"""
type AdminReviewReportTarget {
  """
