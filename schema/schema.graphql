  hasMore: Boolean!
  """다음 페이지 커서. null이면 마지막 페이지다."""
  nextCursor: String
}

"""매장 상품 항목. 공용 상품 카드 + 매장 상품 목록 전용 필드."""
type StoreProduct {
  """상품 카드."""
