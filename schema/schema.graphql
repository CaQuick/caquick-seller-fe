}

"""상품 카테고리 분류."""
enum CategoryType {
  """상황·이벤트 기준 분류(생일, 기념일 등). 홈 화면 칩에는 이 분류만 노출된다."""
  EVENT
  """디자인·스타일 기준 분류."""
  STYLE
  """위 둘로 분류되지 않는 그 밖의 분류. 조회 필터로도 쓸 수 있다."""
  OTHER
}

"""매장 상품 목록 조회 조건. 필터는 AND로 결합된다."""
input StoreProductsInput {
  storeId: ID!
  """특정 카테고리 섹션만. 비우면 전체."""
  categoryId: ID
  """매장 내 상품명·태그 검색어."""
  search: String
  """이전 페이지 마지막 항목 id(이후부터 조회)."""
  cursor: String
  """한 번에 가져올 개수. 기본 20, 1~100만 허용하며 벗어나면 BAD_USER_INPUT."""
  limit: Int = 20
}

"""매장 상품 목록(커서 기반)."""
type StoreProductConnection {
  """매장 상품 항목. 등록 최신순으로 온다."""
  items: [StoreProduct!]!
  """조건에 맞는 활성 상품 전체 건수."""
  totalCount: Int!
