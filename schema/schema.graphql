# ---- src/features/notification/notification-seller-push.graphql ----
extend type Mutation {
  """
  판매자 앱 디바이스의 Expo 푸시 토큰을 등록한다. 판매자 로그인 필수(SELLER 아니면 FORBIDDEN, 매장 없으면 NOT_FOUND).
  같은 토큰을 다시 보내면 마지막 확인 시각만 갱신되고, 다른 판매자가 쓰던 토큰이면 현재 로그인 판매자가 가져간다(앱 재설치·계정 전환).
  해제됐던 토큰은 다시 활성화된다. 토큰이 Expo 형식이 아니면 BAD_REQUEST(INVALID_PUSH_TOKEN).
  앱 시작·로그인마다 호출해도 된다(멱등).
  """
  sellerRegisterPushToken(input: SellerRegisterPushTokenInput!): Boolean!
  """
  푸시 토큰을 해제한다(로그아웃). 판매자 로그인 필수(SELLER 아니면 FORBIDDEN).
  매장 컨텍스트를 보지 않으므로 매장이 없는 판매자도 해제할 수 있다.
  본인이 등록한 토큰만 해제되며, 없거나 남의 토큰이면 아무 일도 하지 않고 true다.
  """
  sellerUnregisterPushToken(input: SellerUnregisterPushTokenInput!): Boolean!
}

"""
푸시 토큰 등록 입력
"""
input SellerRegisterPushTokenInput {
  """
  Expo 푸시 토큰. ExponentPushToken[...] 또는 ExpoPushToken[...] 형식, 최대 200자
  """
  token: String!
  """
  디바이스 플랫폼
  """
  platform: PushPlatform!
  """
  앱이 부여한 디바이스 식별자(선택, 최대 128자). 같은 기기의 토큰 교체 추적용이며 서버 로직은 토큰만 본다
  """
  deviceId: String
}

"""
푸시 토큰 해제 입력
"""
input SellerUnregisterPushTokenInput {
  """
  해제할 Expo 푸시 토큰
  """
  token: String!
}

"""
푸시 디바이스 플랫폼
"""
enum PushPlatform {
  """
  iOS(APNs 경유)
  """
  IOS
  """
  Android(FCM 경유)
  """
  ANDROID
}

# ---- src/features/notification/notification.types.graphql ----
"""
알림 분류. 알림센터 목록의 그룹 기준이다.
"""
enum NotificationType {
  """
  주문 상태 변경 알림. ORDER_CONFIRMED·ORDER_MADE·ORDER_PICKED_UP 이벤트가 여기 속한다.
  """
  ORDER_STATUS
  """
  내 리뷰에 좋아요가 달린 알림. REVIEW_LIKED 이벤트가 여기 속한다.
  """
  REVIEW_LIKE
  """
  운영 공지. 현재 생성 경로가 없는 예약된 분류다.
  """
  SYSTEM
  """
  마케팅 알림. 현재 생성 경로가 없는 예약된 분류다.
  """
  MARKETING
}

"""
알림 이벤트. 알림센터의 아이콘·라벨 매핑 기준 (figma notification-center)
"""
enum NotificationEvent {
  """
  다른 사용자가 내 리뷰에 좋아요를 눌렀다. type은 REVIEW_LIKE.
  """
  REVIEW_LIKED
  """
  판매자가 주문을 확인·수락했다. type은 ORDER_STATUS.
  """
  ORDER_CONFIRMED
  """
  판매자가 제작을 완료했다. type은 ORDER_STATUS.
  """
  ORDER_MADE
  """
  픽업이 완료됐다. type은 ORDER_STATUS.
  """
  ORDER_PICKED_UP
  """
  주문이 취소됐다(판매자 또는 운영자). type은 ORDER_STATUS.
  """
  ORDER_CANCELED
}

