  """할인가(원). 할인이 없으면 null이고 regularPrice가 표시가로 쓰인다."""
  salePrice: Int
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
  """통화 코드(ISO 4217). 저장된 값을 그대로 돌려주며, 현재 KRW만 주문 가능하다."""
  currency: String!
  """후기 탭 카운트."""
