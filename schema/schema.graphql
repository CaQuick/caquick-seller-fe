# ---- src/features/product/product.types.graphql ----
"""상품 카드. 인기 케이크·판매 Best·검색 결과·매장 상품·찜·최근 본 상품이 공용으로 쓴다."""
type ProductCard {
  id: ID!
  """소속 매장 ID(상세 URL 구성용: /store/{storeId}/products/{id})."""
  storeId: ID!
  """상품명."""
  name: String!
  """대표 이미지(sort_order 최소). 없으면 null."""
  thumbnailUrl: String
  """정가(원)."""
  regularPrice: Int!
  """할인가(원). 할인이 없으면 null이고 regularPrice가 표시가로 쓰인다."""
  salePrice: Int
  """할인율(0~100). salePrice 없으면 0."""
  discountRate: Int!
  """매장명."""
  storeName: String!
  """매장 위치 표기(예: 인천 청라동)."""
  regionLabel: String
  """상품 평균 평점(0.0~5.0, 소수 첫째 자리). 리뷰 없으면 0.0."""
  ratingAverage: Float!
  """리뷰 수."""
  reviewCount: Int!
  """로그인 사용자의 찜 여부(비로그인 시 false)."""
  isWishlisted: Boolean!
}

"""
배너 클릭 시 이동할 대상 타입. 구매자 노출·판매자 관리 API가 공용으로 쓴다.

값에 따라 읽어야 할 링크 필드가 정해진다. 구매자 조회(HomeBanner)에서는 서버가
나머지 링크 필드를 null로 비워서 내려주지만, 판매자 조회(SellerBanner)는 저장된
값을 그대로 반환한다 — 판매자 화면에서는 linkType과 맞지 않는 필드에 값이 남아
있을 수 있으므로 linkType을 기준으로 판단해야 한다.
"""
enum BannerLinkType {
  """이동 없음. 구매자 조회에서는 링크 필드가 전부 null로 내려온다."""
  NONE
  """`linkUrl`만 채워진다."""
  URL
  """
  상품으로 이동. 구매자 배너(HomeBanner)는 `linkProductId`와 `linkProductStoreId`가
  함께 채워진다(상품 상세 경로에 매장 ID가 필요). 판매자 배너는 `linkProductId`만 있고
  `linkProductStoreId` 필드 자체가 없다.
  """
  PRODUCT
  """`linkStoreId`만 채워진다."""
  STORE
  """`linkCategoryId`만 채워진다."""
  CATEGORY
}

"""
배너가 노출될 자리. 구매자 API가 실제로 읽는 값은 HOME_MAIN·CATEGORY·SEARCH 셋이고,
나머지는 아직 소비처가 없는 예약값이다.
"""
enum BannerPlacement {
  """홈 '상황별 인기 케이크' 배너. 카테고리 칩이 '전체'일 때 노출된다."""
  HOME_MAIN
  """
  홈 '상황별 인기 케이크' 배너 중 특정 카테고리 칩을 선택했을 때 노출되는 것.
  해당 카테고리로 연결된 배너만 뽑히므로 linkCategoryId를 함께 지정해야 한다.
  카테고리 진입 화면의 배너가 아니다.
  """
  CATEGORY
  """검색 진입 화면 배너 슬롯"""
  SEARCH
  """예약값. 이 자리를 읽는 구매자 쿼리가 없어 등록해도 노출되지 않는다."""
  HOME_SUB
  """예약값. 이 자리를 읽는 구매자 쿼리가 없어 등록해도 노출되지 않는다."""
  STORE
}

# ---- src/features/region/region-admin.graphql ----
extend type Query {
  """
  지역 마스터 목록을 level·sortOrder·id 순으로 조회한다. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminRegions(input: AdminRegionListInput): [AdminRegion!]!
}

extend type Mutation {
  """
  지역을 만든다. parentId가 없으면 1차(광역), 있으면 그 아래 2차(시군구)다 — parentId는 활성 1차 지역이어야
  하며 아니면 BAD_USER_INPUT. slug가 이미 쓰이고 있으면 BAD_USER_INPUT. 삭제된 같은 slug가 있으면 새로 만들지
  않고 복구하되, 삭제된 지역과 level이 다르면 BAD_USER_INPUT. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminCreateRegion(input: AdminCreateRegionInput!): AdminRegion!
  """
  지역을 수정한다. 전달한 필드만 바뀌고 parentId·level은 바꿀 수 없다. slug 충돌이면 BAD_USER_INPUT, 없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminUpdateRegion(input: AdminUpdateRegionInput!): AdminRegion!
  """
  지역을 삭제(soft-delete)한다. 2차 지역에 매장이 연결돼 있거나 1차 지역에 하위 지역(비활성 포함)이 있으면 BAD_USER_INPUT.
  없으면 NOT_FOUND. 관리자 로그인 필수. ADMIN 계정이 아니면 FORBIDDEN.
  """
  adminDeleteRegion(regionId: ID!): Boolean!
}

"""
지역 마스터 1건.
"""
type AdminRegion {
  id: ID!
  """
  상위 1차 지역 ID. 1차 지역이면 null.
  """
  parentId: ID
  """
  1 = 광역 그룹, 2 = 시군구.
  """
  level: Int!
  """
  이름.
  """
  name: String!
  """
  URL·시드용 고유 키.
  """
  slug: String!
  """
  노출 순서. 오름차순.
  """
  sortOrder: Int!
  """
  노출 여부.
  """
  isActive: Boolean!
  """
  중심 위도. 미등록 시 null.
  """
  centerLat: String
  """
  중심 경도. 미등록 시 null.
  """
  centerLng: String
  """
  연결된 매장 수(삭제 제외). 2차 지역만 의미 있다.
  """
  storeCount: Int!
  """
  활성 하위 지역 수. 1차 지역만 의미 있다.
  """
  childCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

"""
지역 목록 조회 조건.
"""
input AdminRegionListInput {
  """
  상위 지역 ID. 지정하면 그 아래 2차 지역만, 미지정 시 전체.
  """
  parentId: ID
  """
  비활성 포함 여부. 기본 false.
  """
  includeInactive: Boolean = false
}

"""
지역 생성 입력.
"""
input AdminCreateRegionInput {
  """
  상위 1차 지역 ID. 없으면 1차 지역을 만든다.
  """
  parentId: ID
  """
  이름. 1~80자.
  """
  name: String!
  """
  고유 키. 1~120자, 소문자·숫자·`-`만.
  """
  slug: String!
  """
  노출 순서. 미지정 시 0.
  """
  sortOrder: Int
  """
  노출 여부. 기본 true.
  """
  isActive: Boolean = true
  """
  중심 위도(문자열, -90~90). 선택.
  """
  centerLat: String
  """
  중심 경도(문자열, -180~180). 선택.
  """
  centerLng: String
}

"""
지역 수정 입력. 전달한 필드만 변경된다.
"""
input AdminUpdateRegionInput {
  regionId: ID!
  """
  이름.
  """
  name: String
  """
  고유 키.
  """
  slug: String
  """
  노출 순서.
  """
  sortOrder: Int
  """
  노출 여부.
  """
  isActive: Boolean
  """
  중심 위도. null이면 제거.
  """
  centerLat: String
  """
  중심 경도. null이면 제거.
  """
  centerLng: String
}

# ---- src/features/region/region.types.graphql ----
extend type Query {
