  """
  이전 응답의 nextCursor. 첫 페이지는 생략한다.
  """
  cursor: String
  """
  상품명 부분일치 검색어. 최대 100자. 미지정 시 전체.
  """
  keyword: String
  """
  소속 매장 ID 필터. 미지정 시 전체.
  """
  storeId: ID
  """
  노출 여부 필터. 미지정 시 전체.
  """
  isActive: Boolean
}

"""
상품 노출 여부 변경 입력.
"""
input AdminSetProductActiveInput {
  productId: ID!
  """
  노출 여부.
  """
  isActive: Boolean!
  """
  변경 사유. 감사 로그에 기록된다. 최대 500자. 선택.
  """
  reason: String
}

# ---- src/features/product/product-category.graphql ----
extend type Query {
